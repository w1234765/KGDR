name: KGDR daily ranking archive

on:
  schedule:
    # 00:10 KST = 15:10 UTC (previous day). GitHub may start scheduled jobs late.
    - cron: '10 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kgdr-daily-history
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Archive current ranking
        run: node scripts/snapshot.cjs
      - name: Commit history to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          if git diff --cached --quiet; then
            echo "No new snapshot"
            exit 0
          fi
          git commit -m "chore: archive KGDR daily ranking"
          git push
