<style>
@import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap");
:root {
    color-scheme: dark;
    --bg: #080a10;
    --panel: #111521;
    --panel2: #171c2a;
    --border: #2a3040;
    --text: #f5f7fc;
    --muted: #949db2;
    --gold: #ffcb67;
    --accent: #88a9ff;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: radial-gradient(ellipse at 50% -10%,#1c2644 0%,#0a0d17 43%,#080a10 85%);
    color: var(--text);
    font-family: "DM Sans",Arial,sans-serif;
    min-height: 100vh;
}

.home {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
    background: radial-gradient(circle at 50% 35%,#283459 0%,#111523 43%,#080a10 78%);
}

.home:before {
    content: "GEOMETRY DASH · KOREA";
    font-size: 12px;
    letter-spacing: 5px;
    color: var(--accent);
    font-weight: 800;
    margin-bottom: 22px;
}

.home h1 {
    font: 700 clamp(86px,17vw,180px)/1 "Space Grotesk",sans-serif;
    letter-spacing: -9px;
    margin: 0;
    background: linear-gradient(130deg,#fff 15%,#aebff6 80%);
    background-clip: text;
    color: transparent;
}

.home p {
    font-size: clamp(16px,2.6vw,24px);
    color: #a6aec4;
    letter-spacing: 2px;
}

.home button,.goButton {
    border: 1px solid #a8b8ed;
    background: #e9efff;
    color: #111729;
    border-radius: 13px;
    font-size: 16px;
    font-weight: 800;
    padding: 16px 32px;
    cursor: pointer;
    transition: .2s;
}

.home button {
    margin-top: 35px;
}

.home button:hover,.goButton:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 28px #0008;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    min-height: 76px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 max(24px,calc((100vw - 1300px)/2));
    background: #0b0e17ed;
    border-bottom: 1px solid #252b3a;
    backdrop-filter: blur(20px);
}

.logo {
    font: 700 27px "Space Grotesk",sans-serif;
    cursor: pointer;
    letter-spacing: -1.5px;
}

.logo span {
    color: #91aaff;
}

.topbar:after {
    content: "THE OFFICIAL RANKING";
    font-size: 10px;
    letter-spacing: 2px;
    color: #8793ad;
    font-weight: 800;
}

.allToggleArea {
    display: none;
    max-width: 1300px;
    margin: 0 auto;
    padding: 32px 20px 0;
    gap: 10px;
    flex-wrap: wrap;
}

.allToggleArea button {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 17px;
    background: #171d2d;
    color: #d8dff0;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    transition: .2s;
}

.allToggleArea button:hover {
    background: #293248;
}

.main {
    display: none;
    max-width: 1300px;
    margin: auto;
    padding: 25px 20px 80px;
    gap: 28px;
    align-items: flex-start;
}

.left {
    flex: 1;
    min-width: 0;
}

.right {
    width: 280px;
    flex-shrink: 0;
    position: sticky;
    top: 103px;
}

.sideBox {
    border: 1px solid var(--border);
    background: #111521;
    border-radius: 17px;
    padding: 25px;
    margin-bottom: 17px;
}

.sideTitle {
    font: 700 23px "Space Grotesk",sans-serif;
    margin-bottom: 16px;
}

.sideText {
    font-size: 14px;
    line-height: 2;
    color: #a4acc0;
}

.goButton {
    width: 100%;
    margin-top: 17px;
    font-size: 13px;
    padding: 14px;
}

.rankingHero {
    padding: 10px 4px 27px;
}

.eyebrow {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #9eb6ff;
    margin-bottom: 12px;
}

.rankingHero h1 {
    font: 700 clamp(38px,5vw,62px)/1.05 "Space Grotesk",sans-serif;
    letter-spacing: -2.7px;
    margin: 0 0 13px;
}

.rankingHero p {
    color: #9da6bc;
    font-size: 14px;
    line-height: 1.8;
    margin: 0;
}

.heroStats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 23px;
}

.heroStats span {
    border: 1px solid #2a3349;
    background: #141b2b;
    border-radius: 30px;
    padding: 9px 14px;
    color: #b9c5dd;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
}

.sectionDivider {
    font-size: 11px;
    letter-spacing: 3px;
    color: #8b96ad;
    font-weight: 800;
    padding: 26px 3px 15px;
}

.level {
    --tone: #7887a4;
    background: linear-gradient(115deg,#171c29,#10141e);
    border: 1px solid #293044;
    border-radius: 16px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: transform .2s,border-color .2s;
    box-shadow: 0 5px 20px #0002;
}

.level:hover {
    transform: translateY(-2px);
    border-color: #53627f;
}

.level.top1 {
    --tone: #f8c768;
    border-color: #6c5430;
    background: linear-gradient(120deg,#292318,#151821 75%);
}

.level.top2 {
    --tone: #c4d1e9;
    border-color: #536078;
    background: linear-gradient(120deg,#20283a,#131823 75%);
}

.level.top3 {
    --tone: #d8a57e;
    border-color: #5d463c;
    background: linear-gradient(120deg,#28201f,#151821 75%);
}

.levelTop {
    display: flex;
    align-items: center;
    gap: 17px;
    padding: 17px;
}

.rankNumber {
    flex: 0 0 57px;
    text-align: center;
    font: 700 29px "Space Grotesk",sans-serif;
    color: var(--tone);
    letter-spacing: -2px;
}

.thumbnailLink {
    display: block;
    flex: 0 0 190px;
    line-height: 0;
}

.thumbnail {
    width: 190px;
    height: 107px;
    object-fit: cover;
    border-radius: 9px;
    background: #222b40;
}

.info {
    flex: 1;
    min-width: 0;
}

.rank {
    font: 700 clamp(18px,2vw,25px)/1.25 "Space Grotesk",sans-serif;
    letter-spacing: -.7px;
    overflow-wrap: anywhere;
}

.publisher {
    margin-top: 8px;
    font-size: 12px;
    color: #a2acc2;
}

.points {
    margin-top: 12px;
    font-size: 11px;
    color: #a6b1c9;
}

.statusBadge {
    display: inline-block;
    border-radius: 6px;
    background: #29384b;
    color: #c1d4ff;
    padding: 5px 9px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
}

.top1 .statusBadge {
    background: #4b3c21;
    color: #fbd78e;
}

.toggle {
    border-top: 1px solid #2b3242;
    padding: 11px 18px;
    text-align: center;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #aab5cb;
    cursor: pointer;
    transition: background .2s;
}

.toggle:hover {
    background: #222b3e;
}

.content {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    visibility: hidden;
    border-top: 0 solid #293142;
    padding: 0 23px;
    background: #0e131f;
    transition:
        max-height 460ms cubic-bezier(.22, 1, .36, 1),
        opacity 300ms ease,
        padding 460ms cubic-bezier(.22, 1, .36, 1),
        border-width 460ms ease,
        visibility 0s linear 460ms;
}

.content.open {
    opacity: 1;
    visibility: visible;
    border-top-width: 1px;
    padding: 20px 23px;
    transition:
        max-height 460ms cubic-bezier(.22, 1, .36, 1),
        opacity 300ms ease,
        padding 460ms cubic-bezier(.22, 1, .36, 1),
        border-width 460ms ease,
        visibility 0s;
}

@media (prefers-reduced-motion: reduce) {
    .content,
    .content.open {
        transition: none;
    }
}

.detailText {
    font-size: 14px;
    line-height: 2;
    color: #c7cede;
}

.detailText br {
    display: block;
    content: "";
    margin: 2px 0;
}

.notes {
    margin-top: 18px;
    border-top: 1px solid #2d3445;
    padding-top: 13px;
    font-size: 13px;
    color: #b8c4d9;
}

.rankingFooter {
    text-align: center;
    color: #77849d;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 30px 0;
}

@media(max-width:980px){.main{flex-direction:column}.right{width:100%;position:static;display:grid;grid-template-columns:1fr 1fr;gap:15px}.sideBox{margin:0}}
@media(max-width:620px){.topbar{padding:0 16px;min-height:64px}.topbar:after{font-size:8px;letter-spacing:1px}.main{padding:20px 12px 60px}.allToggleArea{padding:20px 12px 0}.levelTop{padding:12px;gap:10px}.rankNumber{flex-basis:36px;font-size:22px}.thumbnailLink{flex-basis:100px}.thumbnail{width:100px;height:72px}.rank{font-size:17px}.publisher{font-size:10px}.points{margin-top:7px}.right{display:block}.sideBox{margin-bottom:12px}.home h1{letter-spacing:-5px}}
/* 홈 ↔ 순위표 전환 애니메이션 */
.home {
    transform-origin: center;
}

.home.leaving {
    animation: homeLeave 420ms cubic-bezier(.4, 0, .2, 1) forwards;
    pointer-events: none;
}

.home.returning {
    animation: homeReturn 560ms cubic-bezier(.16, 1, .3, 1) both;
}

.main.entering,
.allToggleArea.entering {
    animation: rankingEnter 650ms cubic-bezier(.16, 1, .3, 1) both;
}

.main.leaving,
.allToggleArea.leaving {
    animation: rankingLeave 300ms ease-in both;
    pointer-events: none;
}

.main.entering .level:nth-of-type(-n+8) {
    animation: cardEnter 550ms cubic-bezier(.16, 1, .3, 1) both;
}

.main.entering .level:nth-of-type(1) { animation-delay: 100ms; }
.main.entering .level:nth-of-type(2) { animation-delay: 155ms; }
.main.entering .level:nth-of-type(3) { animation-delay: 210ms; }
.main.entering .level:nth-of-type(4) { animation-delay: 265ms; }
.main.entering .level:nth-of-type(5) { animation-delay: 320ms; }

@keyframes homeLeave {
    from { opacity: 1; transform: scale(1); filter: blur(0); }
    to { opacity: 0; transform: scale(1.045); filter: blur(7px); }
}

@keyframes homeReturn {
    from { opacity: 0; transform: scale(.96); filter: blur(5px); }
    to { opacity: 1; transform: scale(1); filter: blur(0); }
}

@keyframes rankingEnter {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes rankingLeave {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(12px); }
}

@keyframes cardEnter {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
    .home.leaving,
    .home.returning,
    .main.entering,
    .main.leaving,
    .allToggleArea.entering,
    .allToggleArea.leaving,
    .main.entering .level:nth-of-type(-n+8) {
        animation-duration: 0.01ms;
        animation-delay: 0ms;
    }
}

// 순위는 levels 배열에 직접 작성합니다.
levels.forEach((level,index)=>{
  const label=level[0].replace(/<[^>]*>/g,'').replace(/^\s*#\d+\s*/, '').trim();
  level.displayName=label;
  level.displayRank=index+1;
});

const left = document.getElementById("left");
function renderRanking(rows, dateLabel) {
 cancelDetailSequenceIfAvailable();
left.innerHTML = `<header class="rankingHero"><div class="eyebrow">KOREA GEOMETRY DASH RANKING</div><h1>KGDR TOP ${rows.length}</h1><p>${dateLabel || "2026.10.18 기준 순위표"}</p><div class="heroStats"><span>${rows.length} RANKED DEMONS</span></div></header>`;
rows.forEach((level,index) => {
 const rank=index+1;
 const name=level[0].replace(/<[^>]*>/g,'').replace(/^\s*#\d+\s*/, '').trim();
 if(rank===1 || rank===4 || rank===11 || rank===21 || rank===31 || rank===41){
  const title=rank===1?'THE TOP THREE':rank===4?'TOP 4 — 10':`RANK ${rank} — ${Math.min(rank===11?20:rank===21?30:rank===31?40:rows.length,rows.length)}`;
  left.insertAdjacentHTML('beforeend',`<div class="sectionDivider">${title}</div>`);
 }
 const yt=level[2];
 const thumb=yt?`<a class="thumbnailLink" href="https://youtu.be/${yt}" target="_blank" rel="noopener"><img class="thumbnail" loading="lazy" src="https://img.youtube.com/vi/${yt}/hqdefault.jpg" alt="${name} thumbnail"></a>`:`<div class="thumbnailLink"><div class="thumbnail" style="display:grid;place-items:center;color:#a7b4ce;font-weight:800;font-size:12px;line-height:1.5;text-align:center">NO IMAGE</div></div>`;
 
 const item=document.createElement('article');
 item.className='level '+(rank<=3?'top'+rank:'');
 item.innerHTML=`<div class="levelTop"><div class="rankNumber">${String(rank).padStart(2,'0')}</div>${thumb}<div class="info"><div class="rank">${name}</div><div class="publisher">${level[1]}</div></div></div><div class="toggle" role="button" tabindex="0" aria-expanded="false">DETAILS &nbsp; ↓</div><div class="content"><div class="detailText">${level[3]}</div><div class="notes">${level[4]||''}</div></div>`;
 const toggle=item.querySelector('.toggle');
 toggle.addEventListener('click',()=>toggleContent(toggle));
 toggle.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleContent(toggle)}});
 left.appendChild(item);
});


}
function cancelDetailSequenceIfAvailable(){ if(typeof cancelDetailSequence === "function") cancelDetailSequence(); }
// 개별 카드 및 전체 펼치기/접기 애니메이션
const detailTimers = new Set();

function setDetailOpen(content, isOpen) {
    const button = content.previousElementSibling;

    if (isOpen) {
        content.classList.add("open");
        // 실제 콘텐츠 높이에 맞춰 펼쳐서 긴 설명도 잘리지 않게 합니다.
        content.style.maxHeight = `${content.scrollHeight + 2}px`;
    } else {
        content.style.maxHeight = `${content.scrollHeight}px`;
        // 현재 높이에서 0으로 줄어들도록 브라우저에 시작값을 확정합니다.
        void content.offsetHeight;
        content.classList.remove("open");
        content.style.maxHeight = "0px";
    }

    button.setAttribute("aria-expanded", String(isOpen));
    button.innerHTML = isOpen ? "CLOSE &nbsp; ↑" : "DETAILS &nbsp; ↓";
}

function toggleContent(button) {
    cancelDetailSequence();
    const content = button.nextElementSibling;
    setDetailOpen(content, !content.classList.contains("open"));
}

function cancelDetailSequence() {
    detailTimers.forEach(clearTimeout);
    detailTimers.clear();
}

function animateAllDetails(isOpen) {
    cancelDetailSequence();
    const contents = document.querySelectorAll(".content");

    contents.forEach((content, index) => {
        // 전체 펼치기/접기 시 카드들이 가볍게 순차적으로 반응합니다.
        const timer = setTimeout(() => {
            detailTimers.delete(timer);
            if (content.classList.contains("open") !== isOpen) {
                setDetailOpen(content, isOpen);
            }
        }, index * 16);
        detailTimers.add(timer);
    });
}

function openAll() {
    animateAllDetails(true);
}

function closeAll() {
    animateAllDetails(false);
}

renderRanking(levels, null);

let historyDates = [];
let historyMode = false;
async function toggleMachine() {
 const controls = document.getElementById('machineControls');
 controls.hidden = !controls.hidden;
 if (!controls.hidden) await loadHistoryDates();
}
async function loadHistoryDates() {
 const select = document.getElementById('machineDates');
 select.innerHTML = '<option value="">불러오는 중...</option>';
 try {
  const response = await fetch('./history/index.json', {cache:'no-store'});
  if(!response.ok) throw new Error('HTTP '+response.status);
  const data = await response.json();
  historyDates = (data.dates || []).slice().sort().reverse();
  select.innerHTML = '';
  if (!historyDates.length) throw new Error('저장된 날짜가 없습니다.');
  historyDates.forEach(date => { const option = document.createElement('option'); option.value=date; option.textContent=date; select.appendChild(option); });
 } catch(err) {select.innerHTML = '<option value="">기록을 불러올 수 없습니다</option>'; console.error(err);}
}
async function showHistory() {
 const date = document.getElementById('machineDates').value;
 if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
 try {
  const response = await fetch('./history/'+date+'.json', {cache:'no-store'});
  if(!response.ok) throw new Error('HTTP '+response.status);
  const data = await response.json();
  if (!Array.isArray(data.rows)) throw new Error('잘못된 기록 형식');
  historyMode = true;
  renderRanking(data.rows, date+' 기준 순위표 · 타임머신');
  document.getElementById('machineButton').textContent='타임머신 ⏳';
 } catch(err) { alert('해당 날짜의 순위를 불러오지 못했습니다.'); console.error(err); }
}
function showCurrent() {
 historyMode = false;
 renderRanking(levels, null);
}

let transitionTimer = null;
let currentPage = "home";

function openRanking() {
    if (currentPage !== "home") return;
    currentPage = "transition";
    clearTimeout(transitionTimer);

    const home = document.getElementById("home");
    const main = document.querySelector(".main");
    const controls = document.getElementById("allToggleArea");

    home.classList.remove("returning");
    home.classList.add("leaving");

    transitionTimer = setTimeout(() => {
        home.style.display = "none";
        home.classList.remove("leaving");

        main.style.display = "flex";
        controls.style.display = "flex";
        main.classList.add("entering");
        controls.classList.add("entering");
        window.scrollTo(0, 0);
        currentPage = "ranking";

        setTimeout(() => {
            main.classList.remove("entering");
            controls.classList.remove("entering");
        }, 950);
    }, 420);
}

function goHome() {
    if (currentPage !== "ranking") return;
    currentPage = "transition";
    clearTimeout(transitionTimer);

    const home = document.getElementById("home");
    const main = document.querySelector(".main");
    const controls = document.getElementById("allToggleArea");

    main.classList.remove("entering");
    controls.classList.remove("entering");
    main.classList.add("leaving");
    controls.classList.add("leaving");

    transitionTimer = setTimeout(() => {
        main.style.display = "none";
        controls.style.display = "none";
        main.classList.remove("leaving");
        controls.classList.remove("leaving");

        home.style.display = "flex";
        home.classList.add("returning");
        window.scrollTo(0, 0);
        currentPage = "home";
        setTimeout(() => home.classList.remove("returning"), 560);
    }, 300);
}
